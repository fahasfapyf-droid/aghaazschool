name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aghaaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d aghaaz"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/aghaaz
      AUTH_SECRET: ci-auth-secret-012345678901234567890123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply all Prisma migrations
        run: npx prisma migrate deploy
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Verify Aghaaz report card rules
        run: npm run test:report-card
      - name: Verify Aghaaz Class IB configuration
        run: npm run test:aghaaz-config
      - name: Verify term-specific subjects
        run: npm run test:term-subjects
      - name: Verify examination publication rules
        run: npm run test:exam-publishing
      - name: Verify report card release rules
        run: npm run test:report-card-release
      - name: Verify batch promotion consolidation
        run: npm run test:batch-promotion
      - name: Verify enrollment lifecycle consolidation
        run: npm run test:enrollment-lifecycle
      - name: Verify parent access hardening
        run: npm run test:parent-access
      - name: Verify attendance access hardening
        run: npm run test:attendance-access
      - name: Verify finance integrity
        run: npm run test:finance-integrity
      - name: Production build
        run: npm run build
