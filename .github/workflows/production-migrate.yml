name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BASELINE for an existing db-push production database, or MIGRATE for a database whose baseline is already recorded"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'BASELINE' || github.event.inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Record existing baseline
        if: ${{ github.event.inputs.confirm == 'BASELINE' }}
        run: npx prisma migrate resolve --applied 20260915000000_init
      - name: Apply production migrations
        run: npx prisma migrate deploy
